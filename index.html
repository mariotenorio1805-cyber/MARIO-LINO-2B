<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu blog tech</title>
    <style>
        body {
            font-family: Georgia, serif;
            background-color: #f5f5f5;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        header {
            background: linear-gradient(to right, #071b70, #1764d8);
            color: white;
            text-align: center;
            padding: 25px;
            border-radius: 8px;
        }
        header h1 {
            font-size: 36px;
        }
        header p {
            font-size: 18px;
        }
        main {
            max-width: 850px;
            margin: 30px auto;
        }
        .post {
            background-color: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .post h2 {
            color: #173c83;
            font-size: 30px;
        }
        .post p {
            font-size: 18px;
            line-height: 1.6;
        }
        .autor {
            color: #555;
            font-weight: bold;
        }
        button {
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 10px 15px;
            font-size: 20px;
            cursor: pointer;
            margin-right: 5px;
            margin-top: 10px;
        }
        button:hover {
            background-color: #eeeeff;
        }
        button span {
            margin-left: 5px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Meu blog tech</h1>
        <p>
            Vou compartilhar conhecimentos sobre
            tecnologia e programação
        </p>
    </header>
    <main>
        <div class="post">
            <h2>📚 Meu primeiro post</h2>
            <p class="autor">Por: Mario Lino 2B</p>
            <p>
                Boas-vindas ao meu novo blog!
                Aqui vou compartilhar dicas de programação
                e curiosidades da área de tecnologia.
            </p>
            <!-- Botões de reação -->
            <button>❤️<span>0</span></button>
            <button>👍<span>0</span></button>
            <button>😂<span>0</span></button>
            <button>😮<span>0</span></button>
        </div>
    </main>
    <script>
        const botoes = document.querySelectorAll("button");
        botoes.forEach(function(botao) {
            botao.addEventListener("click", botaoClicado);
            function botaoClicado() {
                console.log("fui clicado");
                let texto = botao.querySelector("span");
                texto.textContent++;
            }
        });
    </script>
</body>
</html>
